name: frigemo_post_terminal
description: Terminal réception Frigemo Cressier – annonce des livraisons.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  mailer: ^6.1.0
  # Ohne obere Grenze, damit pub die zur Flutter-Fassung passende Version
  # waehlt -- der Dateiwaehler haengt eng am Android-Unterbau.
  file_picker: '>=8.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/employees.csv
    - assets/frigemo-logo.png

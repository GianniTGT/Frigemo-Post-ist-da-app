name: frigemo_post_terminal
description: Tiff – Post ist da. Terminal für die Paketannonce am Empfang.
publish_to: 'none'
version: 1.6.0+10

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  mailer: ^6.1.0
  file_picker: ^12.1.0
  mobile_scanner: ^6.0.2
  enough_mail: ^2.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/employees.csv
    - assets/frigemo-logo.png

# Das Startsymbol wird beim Bauen aus diesen Dateien erzeugt -- der Ordner
# android/ liegt nicht im Repository. tiff-icon.png ist das ganze Symbol;
# fuer neuere Android-Fassungen liefert der Vordergrund nur das T, den
# goldenen Grund legt Android selbst darunter und beschneidet ihn passend
# zur Form des Startbildschirms.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/tiff-icon.png
  adaptive_icon_background: "#C9A053"
  adaptive_icon_foreground: assets/icon/tiff-icon-foreground.png
  min_sdk_android: 21

name: APK bauen und als Release veröffentlichen

# Der Build startet nur bei einem Versions-Tag oder von Hand.
# Das APK wird NICHT als Actions-Artefakt hochgeladen (das würde auf das
# 500-MB-Speicherkontingent zählen), sondern direkt an ein Release gehängt.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write   # nötig, damit der Job ein Release anlegen darf

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version bestimmen
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Fehlende Repository-Variablen würden sonst still ein APK erzeugen, das
      # auf localhost zeigt – auf dem Tablet unbrauchbar, aber erst dort sichtbar.
      - name: Konfiguration prüfen
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          TERMINAL_ID: ${{ vars.TERMINAL_ID }}
          TERMINAL_API_KEY: ${{ secrets.TERMINAL_API_KEY }}
        run: |
          missing=""
          [ -n "$API_BASE_URL" ]    || missing="$missing vars.API_BASE_URL"
          [ -n "$TERMINAL_ID" ]     || missing="$missing vars.TERMINAL_ID"
          [ -n "$TERMINAL_API_KEY" ] || missing="$missing secrets.TERMINAL_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Fehlende Konfiguration:$missing – unter Settings → Secrets and variables → Actions eintragen."
            exit 1
          fi
          echo "Server: $API_BASE_URL / Terminal: $TERMINAL_ID"

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Projekt erzeugen, falls nicht vorhanden
        working-directory: app
        run: |
          if [ ! -d android ]; then
            echo "Ordner android/ fehlt – wird generiert."
            flutter create --platforms=android --project-name frigemo_post_terminal .
          fi

      - name: Abhängigkeiten laden
        working-directory: app
        run: flutter pub get

      - name: Statische Analyse
        working-directory: app
        run: flutter analyze --no-fatal-infos

      # Optional: eigener Signaturschlüssel. Ohne die Secrets baut Flutter mit
      # dem Debug-Key – installierbar, aber ein späterer Wechsel auf einen
      # eigenen Key erzwingt eine Neuinstallation auf dem Tablet.
      #
      # Der Schritt trägt die Signatur ins generierte Gradle-Skript ein; ohne
      # das bliebe der Schlüssel wirkungslos, weil `flutter create` immer mit
      # dem Debug-Key signiert.
      - name: Signaturschlüssel einrichten
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Kein KEYSTORE_BASE64 hinterlegt – das APK wird mit dem Debug-Schlüssel signiert."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/frigemo.keystore"
          python3 .github/scripts/inject_signing.py app/android
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: APK bauen
        working-directory: app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          TERMINAL_ID: ${{ vars.TERMINAL_ID }}
          TERMINAL_API_KEY: ${{ secrets.TERMINAL_API_KEY }}
          DEFAULT_LANGUAGE: ${{ vars.DEFAULT_LANGUAGE || 'fr' }}
          FRIGEMO_KEYSTORE: ${{ runner.temp }}/frigemo.keystore
          FRIGEMO_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FRIGEMO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FRIGEMO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_KEY="$TERMINAL_API_KEY" \
            --dart-define=TERMINAL_ID="$TERMINAL_ID" \
            --dart-define=DEFAULT_LANGUAGE="$DEFAULT_LANGUAGE"

      # Ein unbemerkt debug-signiertes Release wäre der teure Fehler: die
      # Neuinstallation auf dem Tablet fällt erst beim nächsten Update auf.
      - name: Signatur prüfen
        if: steps.signing.outputs.signed == 'true'
        run: |
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner nicht gefunden – Signatur konnte nicht geprüft werden."
            exit 0
          fi
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::APK wurde trotz hinterlegtem Keystore mit dem Debug-Schlüssel signiert."
            exit 1
          fi

      - name: APK umbenennen
        run: |
          mv app/build/app/outputs/flutter-apk/app-release.apk \
             frigemo-post-terminal-${{ steps.version.outputs.tag }}.apk
          ls -lh frigemo-post-terminal-*.apk

      - name: Release anlegen und APK anhängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Terminal Réception ${{ steps.version.outputs.tag }}
          body: |
            Terminal de réception Frigemo Cressier.

            **Serveur configuré :** `${{ vars.API_BASE_URL }}`
            **Terminal :** `${{ vars.TERMINAL_ID }}`
            **Signature :** ${{ steps.signing.outputs.signed == 'true' && 'clé de production' || 'clé de debug — une future version signée exigera une réinstallation' }}

            Installation : télécharger l'APK sur la tablette, autoriser
            l'installation depuis cette source, puis activer l'épinglage
            d'écran (Paramètres → Sécurité → Épinglage d'écran).
          files: frigemo-post-terminal-${{ steps.version.outputs.tag }}.apk

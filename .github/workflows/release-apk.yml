name: Terminal-APK prüfen und veröffentlichen

# Zwei Betriebsarten im selben Job:
#
#   Tag 'v*' oder "Run workflow"  -> vollstaendiger Build, Release mit APK.
#   Pull Request auf .github/**   -> laeuft nur bis `flutter analyze`, die
#   oder app/**                      Tests und den Selbsttest des
#                                    Signatur-Skripts. Es wird nichts gebaut
#                                    und nichts veroeffentlicht.
#
# Die PR-Variante gibt es, weil eine kaputte Workflow-Datei sonst erst beim
# Release auffaellt: der erste Lauf dieses Workflows ist mit 0 Jobs
# gescheitert, weil ein step-`if` den secrets-Kontext benutzt hat.
#
# Das APK wird NICHT als Actions-Artefakt hochgeladen (das würde auf das
# 500-MB-Speicherkontingent zählen), sondern direkt an ein Release gehängt.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/**'
      - 'app/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. v1.0.0'
        required: true
        default: 'v1.0.0'
      demo:
        description: 'Demo-APK ohne Server (Liste im Geraet, Versand simuliert)'
        type: boolean
        default: false

permissions:
  contents: write   # nötig, damit der Job ein Release anlegen darf

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version bestimmen
        id: version
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ "${{ inputs.demo }}" = "true" ]; then
            tag="${tag}-demo"
            echo "demo=true" >> "$GITHUB_OUTPUT"
          else
            echo "demo=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Projekt erzeugen, falls nicht vorhanden
        working-directory: app
        run: |
          if [ ! -d android ]; then
            echo "Ordner android/ fehlt – wird generiert."
            flutter create --platforms=android --project-name frigemo_post_terminal .
          fi

      # Ohne diesen Eintrag darf ein Release-APK nicht ins Netz: Flutter setzt
      # die Berechtigung nur in die Debug-Variante. Der SMTP-Versand scheitert
      # sonst schon bei der Namensaufloesung.
      - name: Internet-Berechtigung eintragen
        run: python3 .github/scripts/add_internet_permission.py app/android

      - name: Abhängigkeiten laden
        working-directory: app
        run: flutter pub get

      - name: Statische Analyse
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Tests
        working-directory: app
        run: flutter test

      # Der fragile Teil ist inject_signing.py: es patcht eine Datei, die
      # Flutter generiert und jederzeit aendern kann. Hier laeuft es gegen die
      # echte, gerade erzeugte Vorlage und bricht ab, wenn sie nicht mehr
      # passt -- Monate bevor jemand einen Keystore hinterlegt und sich auf
      # die Signatur verlaesst.
      - name: Skripte gegen die aktuelle Flutter-Vorlage prüfen
        if: github.event_name == 'pull_request'
        run: |
          grep -q 'android.permission.INTERNET' \
            app/android/app/src/main/AndroidManifest.xml
          python3 .github/scripts/add_internet_permission.py app/android  # idempotent?
          python3 .github/scripts/inject_signing.py app/android
          python3 .github/scripts/inject_signing.py app/android   # idempotent?
          gradle=$(ls app/android/app/build.gradle.kts app/android/app/build.gradle 2>/dev/null | head -1)
          grep -q 'FRIGEMO_KEYSTORE' "$gradle"
          echo "Patch sitzt in $gradle."
          {
            echo "### Prüflauf ohne Veröffentlichung"
            echo
            echo "\`flutter analyze\` und der Selbsttest von \`inject_signing.py\` sind gelaufen."
            echo "Es wurde kein APK gebaut und keine Release angelegt — das passiert nur bei einem Tag \`v*\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Optional: eigener Signaturschlüssel. Ohne die Secrets baut Flutter mit
      # dem Debug-Key – installierbar, aber ein späterer Wechsel auf einen
      # eigenen Key erzwingt eine Neuinstallation auf dem Tablet.
      #
      # Der Schritt trägt die Signatur ins generierte Gradle-Skript ein; ohne
      # das bliebe der Schlüssel wirkungslos, weil `flutter create` immer mit
      # dem Debug-Key signiert.
      - name: Signaturschlüssel einrichten
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Kein KEYSTORE_BASE64 hinterlegt – das APK wird mit dem Debug-Schlüssel signiert."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/frigemo.keystore"
          python3 .github/scripts/inject_signing.py app/android
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: APK bauen
        if: github.event_name != 'pull_request'
        working-directory: app
        env:
          DEFAULT_LANGUAGE: ${{ vars.DEFAULT_LANGUAGE || 'fr' }}
          DEMO_MODE: ${{ steps.version.outputs.demo }}
          APP_VERSION: ${{ steps.version.outputs.tag }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          MAIL_FALLBACK: ${{ vars.MAIL_FALLBACK }}
          FRIGEMO_KEYSTORE: ${{ runner.temp }}/frigemo.keystore
          FRIGEMO_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FRIGEMO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FRIGEMO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Ohne gesetztes MAIL_FALLBACK bleibt der Standard aus config.dart
          # (leer) gueltig -- ein leeres --dart-define wuerde ihn ueberschreiben.
          extra=()
          if [ -n "$ADMIN_PIN" ]; then
            extra+=(--dart-define=ADMIN_PIN="$ADMIN_PIN")
          else
            echo "::notice::Kein secrets.ADMIN_PIN gesetzt – die Verwaltung verlangt beim ersten Zugriff, einen Code festzulegen."
          fi
          if [ -n "$MAIL_FALLBACK" ]; then
            extra+=(--dart-define=MAIL_FALLBACK="$MAIL_FALLBACK")
            echo "Gemeinsames Postfach: $MAIL_FALLBACK"
          else
            echo "::notice::Kein vars.MAIL_FALLBACK gesetzt – Meldungen gehen nur an die Person, und \"Empfänger unbekannt\" bleibt ausgeblendet."
          fi

          flutter build apk --release \
            --dart-define=DEFAULT_LANGUAGE="$DEFAULT_LANGUAGE" \
            --dart-define=DEMO_MODE="$DEMO_MODE" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            "${extra[@]}"

      # Ein unbemerkt debug-signiertes Release wäre der teure Fehler: die
      # Neuinstallation auf dem Tablet fällt erst beim nächsten Update auf.
      - name: Signatur prüfen
        if: steps.signing.outputs.signed == 'true'
        run: |
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner nicht gefunden – Signatur konnte nicht geprüft werden."
            exit 0
          fi
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::APK wurde trotz hinterlegtem Keystore mit dem Debug-Schlüssel signiert."
            exit 1
          fi

      - name: APK umbenennen
        if: github.event_name != 'pull_request'
        run: |
          mv app/build/app/outputs/flutter-apk/app-release.apk \
             frigemo-post-terminal-${{ steps.version.outputs.tag }}.apk
          ls -lh frigemo-post-terminal-*.apk

      # Das Repository ist oeffentlich, das APK enthaelt aber den
      # TERMINAL_API_KEY: --dart-define-Werte werden einkompiliert und lassen
      # sich aus der Datei auslesen. Die Release bleibt deshalb ein Entwurf --
      # sichtbar und herunterladbar nur fuer Berechtigte des Repositories.
      # Erst "Publish release" von Hand macht sie oeffentlich; vorher sollte
      # der Schluessel nicht mehr im Build stecken.
      - name: Release als Entwurf anlegen und APK anhängen
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.version.outputs.tag }}
          name: Terminal Réception ${{ steps.version.outputs.tag }}
          body: |
            Terminal de réception Frigemo Cressier.

            ${{ steps.version.outputs.demo == 'true' && '**APK DE DÉMONSTRATION** — liste du personnel fictive intégrée, aucun e-mail n''est envoyé, aucun serveur nécessaire. Ne pas utiliser à la réception.' || '' }}

            **Boîte commune :** `${{ vars.MAIL_FALLBACK || 'aucune — annonce uniquement au destinataire' }}`
            **Signature :** ${{ steps.signing.outputs.signed == 'true' && 'clé de production' || 'clé de debug — une future version signée exigera une réinstallation' }}

            Installation : télécharger l'APK sur la tablette, autoriser
            l'installation depuis cette source, puis activer l'épinglage
            d'écran (Paramètres → Sécurité → Épinglage d'écran).

            ⚠️ Brouillon volontaire : l'APK contient la clé `TERMINAL_API_KEY`,
            extractible du fichier. Ne pas publier cette release tant que le
            dépôt est public.
          files: frigemo-post-terminal-${{ steps.version.outputs.tag }}.apk
